<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link
            href="../../static/bootstrap/css/bootstrap.min.css"
            rel="stylesheet"
            crossorigin="anonymous">
        <link rel="stylesheet"
            href="../../static/font-awesome-4.7.0/css/font-awesome.min.css">
        <link rel="stylesheet"
            href="../../static/css/result.css">
        <link rel="stylesheet"
            href="../../static/css/common.css">
        <script
            src="../../static/bootstrap/js/bootstrap.bundle.min.js"
            crossorigin="anonymous"></script>
    </head>
    <body>
        <div
            class="container d-flex flex-column justify-content-center align-items-center">
            <div class="mt-5">
                {% if is_correct %}
                <i class="fa fa-check fa-5x" aria-hidden="true"></i>
                {% else %}
                <i class="fa fa-times fa-5x" aria-hidden="true"></i>
                {% endif %}
            </div>
            <div class="d-flex justify-content-evenly w-100">
                <div>
                    <a href="/quizz"><img src="../../static/images/next.png"
                            alt="next" /></a>
                    {% if not is_correct %}
                </div>
                <div>
                    <a href="/quizz/{{ quizz_id }}"><img
                            src="../../static/images/retry.png"
                            alt="retry" /></a>
                    {% endif %}
                </div>
            </div>
        </div>
        {% include "partials/return-to-main-menu.html" %}
        {% include "partials/quizz-results-modal.html" %}
    </body>
</html>
